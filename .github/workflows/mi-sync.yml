name: Mi sincronización

# Una vez al día toma lo más nuevo de MetrolistGroup/Metrolist: el último cambio de su rama
# principal que pasó sus pruebas (CI), o su nightly o última versión oficial si alguna es más nueva.
# Si cambió, aplica esos cambios sobre MiMetrolist y compila el teléfono y las dos versiones de Windows.

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mi-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.repository.fork
    runs-on: ubuntu-latest
    steps:
      - name: Descargar MiMetrolist
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Aplicar cambios de la nightly de Metrolist
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          last=$(tr -d '[:space:]' < .github/mi/upstream-sha)
          git remote add upstream https://github.com/MetrolistGroup/Metrolist.git
          # Sigue la nightly y también las versiones oficiales: usa la más nueva de las dos.
          release_tag=$(gh api repos/MetrolistGroup/Metrolist/releases/latest --jq .tag_name 2>/dev/null || true)
          git fetch --no-tags --depth=300 upstream +refs/tags/nightly:refs/upstream/nightly
          new=$(git rev-parse 'refs/upstream/nightly^{commit}')
          label="nightly"
          if [ -n "$release_tag" ] && git fetch --no-tags --depth=300 upstream "+refs/tags/${release_tag}:refs/upstream/release"; then
            release=$(git rev-parse 'refs/upstream/release^{commit}')
            if [ "$release" != "$new" ] && git merge-base --is-ancestor "$new" "$release"; then
              new="$release"
              label="$release_tag"
            fi
          fi
          # La rama principal avanza aunque la nightly se quede quieta: usa su último cambio con las pruebas en verde.
          ci_sha=$(gh run list -R MetrolistGroup/Metrolist --workflow ci.yml --branch main --event push --status success \
            --limit 1 --json headSha --jq '.[0].headSha' 2>/dev/null || true)
          if [ -n "$ci_sha" ]; then
            git fetch --no-tags --depth=300 upstream "+refs/heads/main:refs/upstream/main"
            if git cat-file -e "${ci_sha}^{commit}" 2>/dev/null && git merge-base --is-ancestor "$new" "$ci_sha"; then
              new="$ci_sha"
              label="main"
            fi
          fi
          git fetch --no-tags --depth=300 upstream "$last" || true
          if [ "$new" = "$last" ] || git merge-base --is-ancestor "$new" "$last" 2>/dev/null; then
            echo "Metrolist no tiene nada nuevo (${new::7})."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Los workflows de Metrolist no se usan en esta copia, así que se excluyen.
          git diff --binary "$last" "$new" -- . ':(exclude).github/workflows' > "$RUNNER_TEMP/upstream.patch"
          if [ -s "$RUNNER_TEMP/upstream.patch" ]; then
            if ! git apply --3way --index "$RUNNER_TEMP/upstream.patch"; then
              echo "::error::Los cambios de Metrolist chocan con los de MiMetrolist en estos archivos:"
              git diff --name-only --diff-filter=U || true
              echo "::error::Pídele a Claude que resuelva el conflicto."
              exit 1
            fi
          fi
          echo "$new" > .github/mi/upstream-sha
          git add .github/mi/upstream-sha
          git commit -q -m "sync: Metrolist ${label} ${new::7}"
          git push origin HEAD:${{ github.event.repository.default_branch }}
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Compilar APK nueva
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run mi-apk.yml -R "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
          gh workflow run mi-windows.yml -R "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
          gh workflow run mi-windows-nativo.yml -R "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
